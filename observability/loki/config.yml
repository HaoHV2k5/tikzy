auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Docker can replay old local container logs when Alloy starts for the first
# time, so accept them in this development-only setup.
limits_config:
  reject_old_samples: false

# Retention is intentionally omitted in this local setup. Configure object
# storage and a delete request store before enabling retention in production.
