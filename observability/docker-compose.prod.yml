name: tikzy-observability

services:
  loki:
    image: grafana/loki:${LOKI_VERSION:-latest}
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki
    networks:
      - tikzy

  tempo:
    image: grafana/tempo:${TEMPO_VERSION:-latest}
    restart: unless-stopped
    command: -config.file=/etc/tempo/config.yml
    volumes:
      - ./tempo:/etc/tempo:ro
      - tempo-data:/var/tempo
    networks:
      - tikzy

  mimir:
    image: grafana/mimir:${MIMIR_VERSION:-latest}
    restart: unless-stopped
    command: -config.file=/etc/mimir/config.yml
    volumes:
      - ./mimir:/etc/mimir:ro
      - mimir-data:/data
    networks:
      - tikzy

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-latest}
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./alloy/config.prod.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - tikzy

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SERVER_ROOT_URL: "${GRAFANA_ROOT_URL:?GRAFANA_ROOT_URL must be set}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - tikzy

networks:
  tikzy:
    external: true
    name: ${TIKZY_NETWORK:-tikzy_tikzy}

volumes:
  alloy-data:
  grafana-data:
  loki-data:
  mimir-data:
  tempo-data:
