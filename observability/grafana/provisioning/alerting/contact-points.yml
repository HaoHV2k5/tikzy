apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-oncall
    receivers:
      - uid: telegram-oncall
        type: telegram
        settings:
          chatid: |-
            $TELEGRAM_CHAT_ID
          message: |
            {{ template "default.message" . }}
        secure_settings:
          bottoken: "$TELEGRAM_BOT_TOKEN"
        disableResolveMessage: false
