apiVersion: 1

templates:
  - orgId: 1
    name: telegram.message
    template: |
      {{ define "telegram.message" -}}
      {{ if eq .Status "firing" }}🚨🚨 {{ else }}✅ {{ end }}{{ .Status | toUpper }}: {{ index .CommonLabels "alertname" }}

      ├─ Trạng thái: {{ if eq .Status "firing" }}ĐANG XẢY RA 🔴{{ else }}ĐÃ KHÔI PHỤC 🟢{{ end }}
      ├─ Mức độ: {{ with (index .CommonLabels "severity") }}{{ . }}{{ else }}critical{{ end }}
      ├─ Service: {{ with (index .CommonLabels "service") }}{{ . }}{{ else }}{{ with (index .CommonLabels "component") }}{{ . }}{{ else }}hệ thống{{ end }}{{ end }}
      ├─ Environment: {{ with (index .CommonLabels "environment") }}{{ . }}{{ else }}production{{ end }}
      ├─ Thời gian: {{ (index .Alerts 0).StartsAt }}
      {{- range .Alerts.Firing }}
      ├─ Chi tiết: {{ with index .Annotations "description" }}{{ . }}{{ else }}{{ with index .Annotations "summary" }}{{ . }}{{ else }}Cảnh báo hệ thống{{ end }}{{ end }}
      {{- with index .Annotations "snapshot" }}
      ├─ Snapshot:
      {{ . }}
      {{- end }}
      ├─ Giá trị: {{ with .ValueString }}{{ . }}{{ else }}Không có dữ liệu (No Data){{ end }}
      {{- end }}
      {{- range .Alerts.Resolved }}
      ├─ Chi tiết: {{ with index .Annotations "description" }}{{ . }}{{ else }}{{ with index .Annotations "summary" }}{{ . }}{{ else }}Cảnh báo hệ thống{{ end }}{{ end }}
      {{- with index .Annotations "snapshot" }}
      ├─ Snapshot:
      {{ . }}
      {{- end }}
      {{- end }}
      {{ with (index .Alerts 0).DashboardURL }}
      ├─ Dashboard: {{ . }}
      {{ end }}
      └─ Source: {{ (index .Alerts 0).GeneratorURL }}
      {{- end }}
