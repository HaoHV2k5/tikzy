services:
  backend:
    build:
      context: ./backend
    image: tikzy-backend:local
    environment:
      MANAGEMENT_SERVER_PORT: 8081
      OTEL_SDK_DISABLED: false
      OTEL_SERVICE_NAME: tikzy-backend
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=tikzy,deployment.environment=local
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_INSTRUMENTATION_LOGBACK_MDC_ENABLED: true
    expose:
      - "8081"
    labels:
      com.tikzy.service: tikzy-backend
    networks:
      - tikzy

  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./observability/loki:/etc/loki:ro
      - loki-data:/loki
    networks:
      - tikzy

  tempo:
    image: grafana/tempo:latest
    command: -config.file=/etc/tempo/config.yml
    volumes:
      - ./observability/tempo:/etc/tempo:ro
      - tempo-data:/var/tempo
    networks:
      - tikzy

  mimir:
    image: grafana/mimir:latest
    command: -config.file=/etc/mimir/config.yml
    volumes:
      - ./observability/mimir:/etc/mimir:ro
      - mimir-data:/data
    networks:
      - tikzy

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./observability/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - tikzy

  grafana:
    image: grafana/grafana:latest
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - tempo
      - mimir
    networks:
      - tikzy

networks:
  tikzy:

volumes:
  alloy-data:
  grafana-data:
  loki-data:
  mimir-data:
  tempo-data:
