version: "3.8"
name: tikzy

# Infra local cho Tikzy Backend: Redis (cache + distributed lock chống oversell)
# PostgreSQL dùng Supabase (managed) — không chạy local.

services:
  redis:
    image: redis:7-alpine
    container_name: tikzy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
