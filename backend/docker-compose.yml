version: "3.8"

# Infra local cho Tikzy Backend: Redis (cache + distributed lock chống oversell)
# PostgreSQL dùng Supabase (managed) — không chạy local.

services:
  redis:
    image: redis:7-alpine
    container_name: tikzy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
