spring:
  application:
    name: tikzy-backend

  datasource:
    # Supabase qua PgBouncer Connection Pooler (port 6543)
    # prepareThreshold=0: bắt buộc vì PgBouncer transaction mode không hỗ trợ prepared statements
    url: jdbc:postgresql://${SUPABASE_HOST:aws-0-ap-southeast-1.pooler.supabase.com}:${SUPABASE_PORT:6543}/${SUPABASE_DB:postgres}?prepareThreshold=0
    username: ${SUPABASE_USER}
    password: ${SUPABASE_PASSWORD}
    hikari:
      maximum-pool-size: 15          # theo risk matrix: tránh cạn kiệt connection Supabase
      minimum-idle: 3
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate             # schema do Flyway quản lý, JPA chỉ validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public
    placeholders:
      admin_email: ${ADMIN_EMAIL}
      admin_password_hash: ${ADMIN_PASSWORD_HASH}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      timeout: 5000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

# ===== JWT (Access Token 30p + Refresh Token 7-30 ngày) =====
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION}        # 30 phút
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION}   # 30 ngày
  refresh-token-cookie-name: ${JWT_REFRESH_COOKIE_NAME:refresh_token}
  refresh-token-cookie-secure: ${JWT_REFRESH_COOKIE_SECURE:false} # true khi chạy HTTPS
  refresh-token-cookie-same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Lax}

# ===== Brevo transactional email =====
brevo:
  api-key: ${BREVO_API_KEY:}
  api-url: ${BREVO_API_URL:https://api.brevo.com}
  sender-email: ${BREVO_SENDER_EMAIL:}
  sender-name: ${BREVO_SENDER_NAME:Tikzy}

# ===== Cloudinary =====
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

# ===== Ticket =====
ticket:
  reservation-ttl-minutes: 15        # giữ chỗ 15 phút (Redis lock + orders.expires_at)
  qr-secret: ${QR_SECRET}  # HMAC-SHA256 ký số QR payload

# ===== Logging =====
logging:
  level:
    root: info
    com.tikzy: debug
